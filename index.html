<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E9E5D9">
<title>Confirmación de asistencia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --tinta:   #26302B;   /* verde-negro de la sombra de la nave */
    --piedra:  #E9E5D9;   /* caliza fría, fondo */
    --hueco:   #D8D2C2;   /* juntas y bordes */
    --ocre:    #9C6B24;   /* piedra románica a última hora de la tarde */
    --musgo:   #5B6B57;   /* texto secundario */
    --error:   #8A3324;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--piedra);
    color: var(--tinta);
    font-family: Karla, "Segoe UI", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 30rem;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  /* ---------- secciones ---------- */

  /* El botón del índice ocupa la esquina superior en móvil: dejamos hueco
     para que al saltar a una sección el título no quede debajo. */
  .seccion { scroll-margin-top: 4.5rem; }
  .seccion + .seccion { margin-top: 3.75rem; }

  .titulo {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 1.6rem;
    font-style: italic;
    font-weight: 400;
    text-align: center;
    margin: 0 0 1.25rem;
  }

  /* ---------- portada ---------- */

  .arco { display: block; margin: 0 auto 1.75rem; width: 88px; height: auto; }
  .arco path { fill: none; stroke: var(--ocre); stroke-width: 1.25; }

  .novios {
    text-align: center;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 1.0625rem;
    letter-spacing: .14em;
    color: var(--ocre);
    margin: 0 0 2.25rem;
  }

  .nombre {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(2.4rem, 13vw, 3.9rem);
    line-height: 1.05;
    text-align: center;
    margin: 0 0 1.25rem;
    text-wrap: balance;
  }

  .cita {
    text-align: center;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 1.25rem;
    line-height: 1.5;
    color: var(--musgo);
    margin: 0;
  }
  .cita strong { font-weight: 400; color: var(--tinta); }

  /* ---------- el día ---------- */

  .datos { margin: 0; }
  .datos > div {
    display: grid;
    grid-template-columns: 5.5rem 1fr;
    gap: 0 1rem;
    padding: .8rem 0;
    border-top: 1px solid var(--hueco);
  }
  .datos > div:last-child { border-bottom: 1px solid var(--hueco); }
  .datos dt {
    font-size: .8125rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--musgo);
    align-self: center;
  }
  .datos dd { margin: 0; }

  .mapa {
    display: inline-block;
    margin-top: 1.125rem;
    font-size: .9375rem;
    color: var(--ocre);
    text-decoration: none;
    border-bottom: 1px solid currentColor;
    padding-bottom: 1px;
  }

  /* ---------- índice lateral ---------- */

  /* Base = móvil: panel que entra desde la izquierda.
     A partir de 62rem se convierte en un raíl fijo al lado del texto. */

  .nav-boton {
    position: fixed;
    top: .75rem;
    left: .75rem;
    z-index: 40;
    width: 2.75rem;
    height: 2.75rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--piedra);
    border: 1px solid var(--hueco);
  }
  .nav-boton span {
    display: block;
    width: 18px;
    height: 1px;
    background: var(--tinta);
    transition: transform .25s ease, opacity .2s ease;
  }
  .nav-boton span + span { margin-top: 5px; }
  .nav-boton[aria-expanded="true"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .nav-boton[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .nav-boton[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

  .nav-velo {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    z-index: 30;
    background: rgba(38,48,43,.35);
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease, visibility .3s ease;
  }
  .nav-velo.visible { opacity: 1; visibility: visible; }

  .nav {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 35;
    width: min(76vw, 16rem);
    padding: 4.75rem 1.5rem 2rem;
    background: var(--piedra);
    border-right: 1px solid var(--hueco);
    overflow-y: auto;
    /* visibility apagada: con el panel cerrado los enlaces salen del orden
       de tabulación en vez de quedarse fuera de pantalla y enfocables. */
    visibility: hidden;
    transform: translateX(-100%);
    transition: transform .32s ease, visibility .32s ease;
  }
  .nav.abierto { visibility: visible; transform: none; }

  .nav ol { list-style: none; margin: 0; padding: 0; }
  .nav li + li { margin-top: .125rem; }

  .nav-enlace {
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: .55rem 0;
    color: var(--musgo);
    text-decoration: none;
    font-size: .8125rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    transition: color .18s;
  }
  .nav-enlace:hover { color: var(--tinta); }

  .nav-punto {
    flex: none;
    width: 8px;
    height: 8px;
    border: 1px solid var(--musgo);
    border-radius: 50%;
    transition: background-color .22s, border-color .22s, transform .22s;
  }

  .nav-enlace[aria-current="true"] { color: var(--tinta); }
  .nav-enlace[aria-current="true"] .nav-punto {
    background: var(--ocre);
    border-color: var(--ocre);
    transform: scale(1.35);
  }

  @media (min-width: 62rem) {
    .nav-boton, .nav-velo { display: none; }
    .nav, .nav.abierto {
      top: 50%;
      bottom: auto;
      left: 2rem;
      left: max(1.5rem, calc(50vw - 25.5rem));
      width: auto;
      padding: 0;
      background: none;
      border: 0;
      overflow: visible;
      visibility: visible;
      transform: translateY(-50%);
    }
    .seccion { scroll-margin-top: 2.5rem; }
  }

  /* ---------- formulario ---------- */

  .eleccion { display: grid; gap: .625rem; margin-bottom: 2rem; }

  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
    border-radius: 2px;
  }

  .opcion {
    background: transparent;
    border: 1px solid var(--hueco);
    padding: .9rem 1rem;
    min-height: 3rem;
    text-align: center;
    transition: border-color .18s, background-color .18s;
  }
  .opcion:hover { border-color: var(--musgo); }
  .opcion[aria-pressed="true"] {
    border-color: var(--tinta);
    background: rgba(38,48,43,.055);
    font-weight: 600;
  }

  .detalle {
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height .45s ease, opacity .3s ease;
  }
  .detalle.abierto { max-height: 70rem; opacity: 1; }

  fieldset { border: 0; padding: 0; margin: 0 0 1.75rem; }

  legend {
    padding: 0;
    font-size: .9375rem;
    font-weight: 600;
    margin-bottom: .25rem;
  }

  .ayuda { font-size: .875rem; color: var(--musgo); margin: 0 0 .875rem; }

  .chips { display: flex; flex-wrap: wrap; gap: .5rem; }

  .chip {
    background: transparent;
    border: 1px solid var(--hueco);
    padding: .5rem .875rem;
    font-size: .9375rem;
    transition: border-color .18s, background-color .18s;
  }
  .chip[aria-pressed="true"] {
    border-color: var(--ocre);
    background: rgba(156,107,36,.1);
    font-weight: 500;
  }

  label.campo { display: block; font-size: .9375rem; font-weight: 600; margin-bottom: .375rem; }

  input[type="text"], textarea {
    font: inherit;
    width: 100%;
    background: rgba(255,255,255,.45);
    border: 1px solid var(--hueco);
    border-radius: 2px;
    padding: .7rem .75rem;
    color: inherit;
  }
  textarea { resize: vertical; min-height: 4.5rem; }

  .enviar {
    display: block;
    width: 100%;
    background: var(--tinta);
    color: var(--piedra);
    border: 1px solid var(--tinta);
    padding: 1rem;
    min-height: 3.25rem;
    font-weight: 600;
    letter-spacing: .02em;
    transition: opacity .18s;
  }
  .enviar:hover { opacity: .88; }
  .enviar[disabled] { opacity: .45; cursor: default; }

  :focus-visible { outline: 2px solid var(--ocre); outline-offset: 2px; }

  .estado { text-align: center; font-size: .9375rem; margin: 1rem 0 0; min-height: 1.5rem; }
  .estado.mal { color: var(--error); }

  .centrado { text-align: center; padding: 4rem 0; color: var(--musgo); }

  /* ---------- entrada ---------- */

  .entra { animation: subir .7s ease both; }
  .arco path { stroke-dasharray: 340; stroke-dashoffset: 340; animation: trazo 1.1s ease forwards; }

  @keyframes subir { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes trazo { to { stroke-dashoffset: 0; } }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { animation: none !important; transition: none !important; }
    .arco path { stroke-dashoffset: 0; }
    .detalle { transition: none; }
  }
</style>
</head>
<body>

<div id="navegacion"></div>
<main id="app"><p class="centrado">Abriendo la invitación…</p></main>

<script>
/* Bloque aparte y en ES5: si el navegador del invitado no entiende el script
   principal, al menos vemos el error en pantalla en vez de quedarnos colgados. */
window.onerror = function (msg, src, linea) {
  var a = document.getElementById('app');
  if (a) { a.innerHTML = '<p class="centrado">Error: ' + msg + ' (línea ' + linea + ')</p>'; }
  return true;
};
</script>

<script>
/* ====== EDITA ESTO ====== */
const API = 'https://script.google.com/macros/s/AKfycbzRKFxanuuyYgMC9aGoi7N7Tcc9DQh87MlCwkAI1azH2oKTixYahhLtAIxfvr4EKA_oyQ/exec';

var BODA = {
  novios: 'Irene e Ignacio',
  fecha:  '17 de Julio de 2027',
  lugar:  'Convento de Mave, Palencia',
  hora:   '12:30',
  mapa:   'https://www.google.com/maps/search/?api=1&query=Convento%20de%20Mave%20Palencia'
};

/* Índice lateral: el orden manda. Cada `id` tiene que existir en la página o
   la entrada se descarta sola. Para añadir una sección, crea el
   <section class="seccion" id="..."> dentro de pintar() y añádela aquí. */
var SECCIONES = [
  { id: 'inicio',    titulo: 'Inicio' },
  { id: 'el-dia',    titulo: 'El día' },
  { id: 'confirmar', titulo: 'Confirmar' }
];

var ALERGENOS = [
  'Gluten', 'Lactosa', 'Frutos secos', 'Marisco',
  'Pescado', 'Huevo', 'Soja', 'Vegetariano', 'Vegano'
];
/* ======================== */

var app = document.getElementById('app');
var token = (function () {
  var m = location.search.match(/[?&]i=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : '';
})();

var elegido = null;          // true | false | null
var marcados = {};           // alérgenos seleccionados

/* --- red, con XMLHttpRequest para no depender de fetch ni de promesas --- */
function pedir(metodo, url, cuerpo, alTerminar) {
  var x = new XMLHttpRequest();
  x.open(metodo, url, true);
  x.timeout = 20000;
  if (metodo === 'POST') {
    // text/plain a propósito: application/json dispara el preflight CORS,
    // que Apps Script no responde.
    x.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
  }
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    var d = null;
    try { d = JSON.parse(x.responseText); } catch (e) {}
    alTerminar(d);
  };
  x.onerror = function () { alTerminar(null); };
  x.ontimeout = function () { alTerminar(null); };
  x.send(cuerpo || null);
}

function escapar(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function pantalla(html) { app.innerHTML = html; }

function aviso(texto) {
  pantalla('<p class="centrado">' + escapar(texto) + '</p>');
}

/* --- carga --- */
function cargar() {
  if (!token) {
    aviso('Este enlace está incompleto. Escríbenos y te mandamos el tuyo.');
    return;
  }
  pedir('GET', API + '?token=' + encodeURIComponent(token), null, function (d) {
    if (!d) { aviso('No hemos podido conectar. Prueba otra vez en un momento.'); return; }
    if (!d.ok) { aviso('No encontramos este enlace. Escríbenos y lo revisamos.'); return; }
    pintar(d);
  });
}

function pintar(d) {
  var chips = '';
  for (var i = 0; i < ALERGENOS.length; i++) {
    chips += '<button type="button" class="chip" data-a="' + escapar(ALERGENOS[i]) + '" aria-pressed="false">'
           + escapar(ALERGENOS[i]) + '</button>';
  }

  pantalla(
    '<div class="entra">' +

      '<section class="seccion" id="inicio">' +
        '<svg class="arco" viewBox="0 0 120 132" aria-hidden="true">' +
          '<path d="M4 130 L4 64 A56 56 0 0 1 116 64 L116 130"/>' +
        '</svg>' +
        '<p class="novios">' + escapar(BODA.novios) + '</p>' +
        '<h1 class="nombre">' + escapar(d.nombre) + '</h1>' +
        '<p class="cita">Nos casamos el <strong>' + escapar(BODA.fecha) + '</strong></p>' +
      '</section>' +

      '<section class="seccion" id="el-dia">' +
        '<h2 class="titulo">El día</h2>' +
        '<dl class="datos">' +
          '<div><dt>Fecha</dt><dd>' + escapar(BODA.fecha) + '</dd></div>' +
          '<div><dt>Hora</dt><dd>' + escapar(BODA.hora) + '</dd></div>' +
          '<div><dt>Lugar</dt><dd>' + escapar(BODA.lugar) + '</dd></div>' +
        '</dl>' +
        (BODA.mapa
          ? '<p style="margin:0"><a class="mapa" href="' + escapar(BODA.mapa) + '" target="_blank" rel="noopener">Ver cómo llegar</a></p>'
          : '') +
      '</section>' +

      '<section class="seccion" id="confirmar">' +
        '<h2 class="titulo">¿Nos acompañas?</h2>' +
        '<div class="eleccion">' +
          '<button type="button" class="opcion" id="si" aria-pressed="false">Sí, allí estaré</button>' +
          '<button type="button" class="opcion" id="no" aria-pressed="false">No podré ir</button>' +
        '</div>' +

        '<div class="detalle" id="detalle">' +
          '<fieldset>' +
            '<legend>Alergias e intolerancias</legend>' +
            '<p class="ayuda">Marca lo que necesites. Se lo pasamos tal cual a la cocina.</p>' +
            '<div class="chips" id="chips">' + chips + '</div>' +
          '</fieldset>' +
          '<fieldset>' +
            '<label class="campo" for="otros">Otra cosa que debamos saber</label>' +
            '<input type="text" id="otros" placeholder="Otra alergia, medicación, lo que sea">' +
          '</fieldset>' +
        '</div>' +

        '<fieldset>' +
          '<label class="campo" for="nota">Un mensaje para nosotros</label>' +
          '<textarea id="nota" placeholder="Opcional"></textarea>' +
        '</fieldset>' +

        '<button type="button" class="enviar" id="enviar" disabled>Enviar confirmación</button>' +
        '<p class="estado" id="estado"></p>' +
      '</section>' +

    '</div>'
  );

  document.getElementById('si').onclick = function () { elegir(true); };
  document.getElementById('no').onclick = function () { elegir(false); };
  document.getElementById('enviar').onclick = enviar;

  var botonesChip = document.getElementById('chips').getElementsByTagName('button');
  for (var j = 0; j < botonesChip.length; j++) {
    botonesChip[j].onclick = function () {
      var nombre = this.getAttribute('data-a');
      var activo = this.getAttribute('aria-pressed') === 'true';
      this.setAttribute('aria-pressed', activo ? 'false' : 'true');
      if (activo) { delete marcados[nombre]; } else { marcados[nombre] = true; }
    };
  }

  montarIndice();
  restaurar(d);
}

/* --- índice lateral --- */
function montarIndice() {
  var presentes = [];
  var lista = '';

  for (var i = 0; i < SECCIONES.length; i++) {
    if (!document.getElementById(SECCIONES[i].id)) continue;
    presentes.push(SECCIONES[i].id);
    lista += '<li><a class="nav-enlace" href="#' + escapar(SECCIONES[i].id) + '">'
           + '<span class="nav-punto" aria-hidden="true"></span>'
           + '<span>' + escapar(SECCIONES[i].titulo) + '</span></a></li>';
  }

  // Con una sola sección el índice sobra.
  if (presentes.length < 2) return;

  document.getElementById('navegacion').innerHTML =
    '<button type="button" class="nav-boton" id="nav-boton" aria-expanded="false"' +
      ' aria-controls="nav-indice" aria-label="Índice de la invitación">' +
      '<span></span><span></span><span></span>' +
    '</button>' +
    '<div class="nav-velo" id="nav-velo"></div>' +
    '<nav class="nav" id="nav-indice" aria-label="Secciones de la invitación">' +
      '<ol>' + lista + '</ol>' +
    '</nav>';

  var boton = document.getElementById('nav-boton');
  var panel = document.getElementById('nav-indice');
  var velo  = document.getElementById('nav-velo');
  var enlaces = panel.getElementsByTagName('a');

  function abrir(si) {
    boton.setAttribute('aria-expanded', si ? 'true' : 'false');
    panel.className = si ? 'nav abierto' : 'nav';
    velo.className  = si ? 'nav-velo visible' : 'nav-velo';
    document.body.style.overflow = si ? 'hidden' : '';
  }

  boton.onclick = function () { abrir(boton.getAttribute('aria-expanded') !== 'true'); };
  velo.onclick  = function () { abrir(false); };
  for (var j = 0; j < enlaces.length; j++) {
    enlaces[j].onclick = function () { abrir(false); };
  }
  document.onkeydown = function (e) {
    var esc = e.key === 'Escape' || e.key === 'Esc' || e.keyCode === 27;
    if (esc && boton.getAttribute('aria-expanded') === 'true') { abrir(false); }
  };
  // Si el móvil abierto pasa a ancho de escritorio (giro de pantalla), el panel
  // se convierte en raíl y hay que soltar el bloqueo del scroll.
  window.onresize = function () {
    if (window.innerWidth >= 992) { abrir(false); }
  };

  function marcar(id) {
    for (var k = 0; k < enlaces.length; k++) {
      if (enlaces[k].getAttribute('href') === '#' + id) {
        enlaces[k].setAttribute('aria-current', 'true');
      } else {
        enlaces[k].removeAttribute('aria-current');
      }
    }
  }
  marcar(presentes[0]);

  if (window.IntersectionObserver) {
    var visibles = {};
    var observador = new IntersectionObserver(function (entradas) {
      for (var m = 0; m < entradas.length; m++) {
        visibles[entradas[m].target.id] = entradas[m].isIntersecting;
      }
      // Gana la primera de la lista que cruce la franja central.
      for (var n = 0; n < presentes.length; n++) {
        if (visibles[presentes[n]]) { marcar(presentes[n]); return; }
      }
    }, { rootMargin: '-45% 0px -50% 0px' });

    for (var p = 0; p < presentes.length; p++) {
      observador.observe(document.getElementById(presentes[p]));
    }
  } else {
    var repasar = function () {
      var eje = (window.pageYOffset || document.documentElement.scrollTop) + window.innerHeight * 0.4;
      var mejor = presentes[0];
      for (var q = 0; q < presentes.length; q++) {
        if (document.getElementById(presentes[q]).offsetTop <= eje) { mejor = presentes[q]; }
      }
      marcar(mejor);
    };
    window.onscroll = repasar;
    repasar();
  }
}

/* Si ya había respondido antes, dejamos su respuesta puesta. */
function restaurar(d) {
  if (d.alergenos) {
    var previos = String(d.alergenos).split(',');
    var botones = document.getElementById('chips').getElementsByTagName('button');
    for (var i = 0; i < previos.length; i++) {
      var v = previos[i].replace(/^\s+|\s+$/g, '');
      for (var j = 0; j < botones.length; j++) {
        if (botones[j].getAttribute('data-a') === v) {
          botones[j].setAttribute('aria-pressed', 'true');
          marcados[v] = true;
        }
      }
    }
  }
  if (d.nota) { document.getElementById('nota').value = d.nota; }
  if (d.asiste === 'SI') { elegir(true); }
  else if (d.asiste === 'NO') { elegir(false); }
  if (d.asiste) {
    document.getElementById('estado').textContent =
      'Ya tenemos tu respuesta. Puedes cambiarla cuando quieras.';
  }
}

function elegir(asiste) {
  elegido = asiste;
  document.getElementById('si').setAttribute('aria-pressed', asiste ? 'true' : 'false');
  document.getElementById('no').setAttribute('aria-pressed', asiste ? 'false' : 'true');

  var detalle = document.getElementById('detalle');
  if (asiste) { detalle.className = 'detalle abierto'; }
  else { detalle.className = 'detalle'; }

  document.getElementById('enviar').disabled = false;
}

function enviar() {
  if (elegido === null) return;

  var boton = document.getElementById('enviar');
  var estado = document.getElementById('estado');
  boton.disabled = true;
  estado.className = 'estado';
  estado.textContent = 'Guardando…';

  var lista = [];
  for (var k in marcados) { if (marcados.hasOwnProperty(k)) lista.push(k); }
  var otros = document.getElementById('otros').value.replace(/^\s+|\s+$/g, '');
  if (otros) lista.push(otros);

  var cuerpo = JSON.stringify({
    token: token,
    asiste: elegido,
    alergenos: elegido ? lista.join(', ') : '',
    nota: document.getElementById('nota').value
  });

  pedir('POST', API, cuerpo, function (d) {
    boton.disabled = false;
    if (d && d.ok) {
      estado.textContent = elegido
        ? 'Guardado. Nos vemos allí.'
        : 'Guardado. Te echaremos de menos.';
    } else {
      estado.className = 'estado mal';
      estado.textContent = 'No se ha podido guardar. Inténtalo otra vez.';
    }
  });
}

cargar();
</script>

</body>
</html>
